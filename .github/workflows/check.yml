name: Check plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: git diff --exit-code -- desktop/plugin.js
      - run: npm test
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests/python -q
      - run: python -m unittest discover -s tests/setup -q
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 -DryRun
